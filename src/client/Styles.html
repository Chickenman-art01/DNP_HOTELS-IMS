<style>
  @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200');

  @layer base {
    html, body {
      margin: 0;
      padding: 0;
      background-color: #11131b;
      color: #e1e2ed;
      font-family: 'Hanken Grotesk', sans-serif;
    }
    body {
      overscroll-behavior: none;
    }
  }

  /* Custom dark scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #11131b;
  }
  ::-webkit-scrollbar-thumb {
    background: #282a32;
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #434655;
  }

  /* Material Symbols icon sizing helper */
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    user-select: none;
  }
  .material-symbols-outlined.fill {
    font-variation-settings: 'FILL' 1;
  }

  /* Modal Backdrop */
  .modal-backdrop {
    background-color: rgba(12, 14, 22, 0.82);
    backdrop-filter: blur(8px);
    transition: opacity 0.2s ease-in-out;
  }

  /* Toast Animation */
  @keyframes slideInRight {
    from {
      transform: translateX(100%);
      opacity: 0;
    }
    to {
      transform: translateX(0);
      opacity: 1;
    }
  }

  .toast-enter {
    animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Print specific formatting for Barcode Labels */
  @media print {
    body * {
      visibility: hidden;
    }
    #printableBarcodeArea, #printableBarcodeArea * {
      visibility: visible;
    }
    #printableBarcodeArea {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: white !important;
      color: black !important;
    }
    .no-print {
      display: none !important;
    }
  }
</style>
