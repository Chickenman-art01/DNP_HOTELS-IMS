<script>
/**
 * DNP HOTELS - IMS CLIENT APPLICATION LOGIC
 */

const app = {
  state: {
    dbInfo: {},
    metrics: {},
    items: [],
    suppliers: [],
    departments: [],
    locations: [],
    settings: { CURRENCY_SYMBOL: '₹', HOTEL_NAME: 'DNP HOTELS' },
    recentTransactions: [],
    activeTab: 'dashboard',
    propertyFilter: 'ALL',
    categoryChart: null,
    html5QrScanner: null
  },

  // Initialize App
  init: function() {
    this.loadInitialData();
  },

  // Check if running inside Google Apps Script environment
  isGasEnv: function() {
    return typeof google !== 'undefined' && google.script && google.script.run;
  },

  // Show Global Loading
  showLoading: function(title, subtitle) {
    const el = document.getElementById('loadingOverlay');
    if (el) {
      if (title) document.getElementById('loadingTitle').innerText = title;
      if (subtitle) document.getElementById('loadingSubtitle').innerText = subtitle;
      el.classList.remove('hidden');
    }
  },

  hideLoading: function() {
    const el = document.getElementById('loadingOverlay');
    if (el) el.classList.add('hidden');
    const refreshIcon = document.getElementById('refreshIcon');
    if (refreshIcon) refreshIcon.classList.remove('fa-spin');
  },

  // Toast System
  showToast: function(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = `toast-enter pointer-events-auto px-4 py-3 rounded-xl shadow-xl text-xs font-semibold flex items-center space-x-2.5 max-w-sm border ${
      type === 'success' ? 'bg-emerald-900 text-emerald-100 border-emerald-700' :
      type === 'error' ? 'bg-rose-900 text-rose-100 border-rose-700' :
      'bg-slate-900 text-slate-100 border-slate-700'
    }`;

    const icon = type === 'success' ? 'fa-circle-check text-emerald-400' :
                 type === 'error' ? 'fa-circle-exclamation text-rose-400' :
                 'fa-circle-info text-amber-400';

    toast.innerHTML = `
      <i class="fa-solid ${icon} text-base flex-shrink-0"></i>
      <div class="flex-1">${message}</div>
      <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white">&times;</button>
    `;

    container.appendChild(toast);
    setTimeout(() => {
      if (toast.parentElement) toast.remove();
    }, 4500);
  },

  // Load Initial Data from Backend
  loadInitialData: function(isRefresh = false) {
    const refreshIcon = document.getElementById('refreshIcon');
    if (refreshIcon) refreshIcon.classList.add('fa-spin');
    
    if (isRefresh) {
      this.showToast('Refreshing inventory from Google Sheets...', 'info');
    }

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(response) {
          app.handleInitialDataSuccess(response);
          if (isRefresh) app.showToast('Database up to date!');
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Error loading database: ' + err.message, 'error');
        })
        .getInitialData();
    } else {
      // Local preview mock fallback
      console.warn('Google Apps Script environment not detected. Using sample mock database.');
      setTimeout(() => {
        app.handleInitialDataSuccess(app.getMockData());
      }, 300);
    }
  },

  handleInitialDataSuccess: function(data) {
    this.hideLoading();
    if (!data) return;

    this.state.workbooksInfo = data.workbooksInfo || {};
    this.state.dbInfo = data.dbInfo || (data.workbooksInfo ? data.workbooksInfo.folder : {});
    this.state.metrics = data.metrics || {};
    this.state.items = data.items || [];
    this.state.suppliers = data.suppliers || [];
    this.state.stores = data.stores || [];
    this.state.sellingPoints = data.sellingPoints || [];
    this.state.departments = data.departments || [];
    this.state.locations = data.locations || [];
    this.state.users = data.users || [];
    this.state.settings = data.settings || { CURRENCY_SYMBOL: '₹', HOTEL_NAME: '21 Gun Salute & Pahle Chai (DNP Hotels)' };
    this.state.supplierTransactions = data.supplierTransactions || [];
    this.state.issuanceTransactions = data.issuanceTransactions || [];
    this.state.recentTransactions = data.issuanceTransactions || data.recentTransactions || [];

    // Update Nav Count
    const navBadge = document.getElementById('navTotalItemsBadge');
    if (navBadge) navBadge.innerText = this.state.items.length;

    // Update Google Sheet links and Multi-Workbook grid
    this.updateGoogleSheetLinks();

    // Populate dropdowns across modals with real 28 suppliers, stores, and selling points
    this.populateAllSelectDropdowns();

    // Render components
    this.renderDashboard();
    this.filterCatalog();
    this.filterTransactions();
    this.renderSuppliers();
    this.renderDepartmentsAndLocations();
    this.renderSettingsTab();
  },

  updateGoogleSheetLinks: function() {
    const wbInfo = this.state.workbooksInfo || {};
    const folder = wbInfo.folder || {
      id: '1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx',
      name: 'DNP Database Drive Folder',
      url: 'https://drive.google.com/drive/folders/1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx'
    };

    const headerDriveLink = document.getElementById('openDriveFolderBtn');
    if (headerDriveLink && folder.url) {
      headerDriveLink.href = folder.url;
    }

    const driveDirectLink = document.getElementById('openDriveFolderDirectLink');
    if (driveDirectLink && folder.url) {
      driveDirectLink.href = folder.url;
    }

    const folderNameEl = document.getElementById('driveFolderName');
    if (folderNameEl) folderNameEl.innerText = folder.name || 'DNP Database Drive Folder';

    const folderIdEl = document.getElementById('driveFolderId');
    if (folderIdEl) folderIdEl.innerText = folder.id || '1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx';

    this.renderWorkbooksGrid();
  },

  renderWorkbooksGrid: function() {
    const container = document.getElementById('workbooksGrid');
    if (!container) return;

    const workbooks = (this.state.workbooksInfo && this.state.workbooksInfo.workbooks) ? this.state.workbooksInfo.workbooks : [
      { key: 'Location_Master', name: 'Location_Master', sheets: ['Store', 'Selling_Point'], url: 'https://drive.google.com/drive/folders/1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx' },
      { key: 'Product_Master', name: 'Product_Master', sheets: ['Product_Master'], url: 'https://drive.google.com/drive/folders/1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx' },
      { key: 'Supplier_Master', name: 'Supplier_Master', sheets: ['Supplier_Master (28 Vendors)'], url: 'https://drive.google.com/drive/folders/1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx' },
      { key: 'Supplier_Transactions', name: 'Supplier_Transactions', sheets: ['Supplier_Transactions'], url: 'https://drive.google.com/drive/folders/1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx' },
      { key: 'Issuance_Transactions', name: 'Issuance_Transactions', sheets: ['Issuance_Transactions'], url: 'https://drive.google.com/drive/folders/1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx' },
      { key: 'Users_and_Settings', name: 'Users_and_Settings', sheets: ['Users', 'Settings'], url: 'https://drive.google.com/drive/folders/1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx' }
    ];

    const iconMap = {
      'Location_Master': 'storefront',
      'Product_Master': 'inventory_2',
      'Supplier_Master': 'local_shipping',
      'Supplier_Transactions': 'receipt_long',
      'Issuance_Transactions': 'outbox',
      'Users_and_Settings': 'settings_suggest'
    };

    container.innerHTML = workbooks.map(wb => {
      const icon = iconMap[wb.key] || 'table_view';
      const sheetPills = (wb.sheets || []).map(s => 
        `<span class="bg-surface-container-highest text-primary font-data-tabular px-1.5 py-0.5 rounded text-[10px]">${s}</span>`
      ).join(' ');

      return `
        <div class="bg-surface-container-high rounded-xl p-md border border-outline-variant/10 flex flex-col justify-between hover:border-outline-variant/30 transition space-y-3">
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="material-symbols-outlined text-primary text-[24px]">${icon}</span>
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-secondary-container/20 text-secondary border border-secondary/20">
                <span class="w-1.5 h-1.5 rounded-full bg-secondary mr-1"></span> Live Sync
              </span>
            </div>
            <div>
              <h4 class="font-bold text-on-surface text-sm">${wb.name}</h4>
              <p class="text-[11px] text-outline font-data-tabular truncate">ID: ${wb.id || 'Active Drive File'}</p>
            </div>
            <div class="flex flex-wrap gap-1 pt-1">
              ${sheetPills}
            </div>
          </div>
          <div class="pt-2 border-t border-outline-variant/10 flex items-center justify-between">
            <a href="${wb.url}" target="_blank" class="inline-flex items-center gap-1 text-xs font-semibold text-primary hover:underline">
              <span>Open in Sheets</span>
              <span class="material-symbols-outlined text-[14px]">open_in_new</span>
            </a>
          </div>
        </div>
      `;
    }).join('');
  },

  // Number & Currency Formatters
  formatCurrency: function(amount) {
    const symbol = this.state.settings.CURRENCY_SYMBOL || '₹';
    const num = Number(amount) || 0;
    return symbol + ' ' + num.toLocaleString();
  },

  formatNumber: function(amount) {
    return (Number(amount) || 0).toLocaleString();
  },

  // TAB NAVIGATION
  switchTab: function(tabId) {
    this.state.activeTab = tabId;

    // Update Sidebar Nav Items
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      item.className = 'nav-item flex items-center px-md py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all duration-200 group';
    });

    const activeBtn = document.getElementById('navBtn-' + tabId);
    if (activeBtn) {
      activeBtn.className = 'nav-item flex items-center px-md py-3 rounded-lg transition-all duration-200 group bg-primary-container text-on-primary-container font-semibold shadow-lg shadow-primary/20';
    }

    // Toggle Content Panes
    const panes = document.querySelectorAll('.tab-pane');
    panes.forEach(p => p.classList.add('hidden'));

    const targetPane = document.getElementById('tabContent-' + tabId);
    if (targetPane) {
      targetPane.classList.remove('hidden');
    }

    // Trigger Chart Resize if Reports
    if (tabId === 'reports' && this.state.categoryChart) {
      this.state.categoryChart.resize();
    }
  },

  handleGlobalSearch: function(query) {
    const q = (query || '').trim();
    if (!q) return;
    if (this.state.activeTab !== 'products') {
      this.switchTab('products');
    }
    const searchInput = document.getElementById('catalogSearchInput');
    if (searchInput) {
      searchInput.value = q;
      this.filterCatalog();
    }
  },

  filterByLocation: function(locName) {
    let prop = 'ALL';
    const l = locName.toUpperCase();
    if (l.includes('CENTRAL')) prop = 'CENTRAL';
    else if (l.includes('DENEB')) prop = 'DENEB';
    else if (l.includes('POLLUX')) prop = 'POLLUX';

    const filter = document.getElementById('headerPropertyFilter');
    if (filter) filter.value = prop;
    this.handlePropertyFilterChange(prop);
    this.switchTab('products');
  },

  handlePropertyFilterChange: function(propertyCode) {
    this.state.propertyFilter = propertyCode;
    this.filterCatalog();
    this.filterTransactions();
    this.showToast(`View filtered to: ${propertyCode === 'ALL' ? 'All Properties' : propertyCode + ' Store'}`);
  },

  // ==========================================
  // DASHBOARD RENDERING (MATERIAL 3)
  // ==========================================
  renderDashboard: function() {
    const m = this.state.metrics || {};
    const sym = this.state.settings.CURRENCY_SYMBOL || '₹';

    // Live Timestamp
    const now = new Date();
    const tsEl = document.getElementById('liveTimestamp');
    if (tsEl) {
      const dStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const tStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
      tsEl.innerText = `${dStr} | ${tStr}`;
    }

    // KPI Summary Cards
    const skusEl = document.getElementById('dashTotalSkus');
    if (skusEl) skusEl.innerText = this.formatNumber(m.totalSkus || 0);

    const unitsEl = document.getElementById('dashTotalUnits');
    if (unitsEl) unitsEl.innerText = `${this.formatNumber(m.totalUnits || 0)} units total`;

    const lowEl = document.getElementById('dashLowStockCount');
    if (lowEl) lowEl.innerText = this.formatNumber((m.lowStockCount || 0) + (m.outOfStockCount || 0));

    const today = m.todaySummary || { txnCount: 0, stockIn: 0, stockOut: 0 };
    const txnsEl = document.getElementById('dashTodayTxns');
    if (txnsEl) txnsEl.innerText = this.formatNumber(today.txnCount || 0);

    const inEl = document.getElementById('dashStockInToday');
    if (inEl) inEl.innerText = `+${today.stockIn || 0} In`;

    const outEl = document.getElementById('dashStockOutToday');
    if (outEl) outEl.innerText = `-${today.stockOut || 0} Out`;

    const valEl = document.getElementById('dashTotalValuation');
    if (valEl) valEl.innerText = this.formatCurrency(m.totalValuation || 0);

    const tipEl = document.getElementById('chartTooltipVal');
    if (tipEl) tipEl.innerText = this.formatCurrency(m.totalValuation || 0);

    // Dynamic Middle Row
    this.renderCategoryBars(m.categoryBreakdown || {});
    this.renderTopIssuedItems();
    this.renderRecentRequisitions();

    // Dynamic Bottom Row
    this.renderManagedProperties(m.locations);
    this.renderLowStockTable(m.lowStockItems || []);

    // Reports Breakdown
    this.renderCategoryChart(m.categoryBreakdown || {});
    this.renderReportsLocations(m.locations);
  },

  renderCategoryBars: function(categoryMap) {
    const container = document.getElementById('categoryBarsContainer');
    if (!container) return;

    const categories = Object.keys(categoryMap);
    let sorted = categories.map(c => ({
      name: c,
      units: categoryMap[c].units || (categoryMap[c].count ? categoryMap[c].count * 40 : 150),
      value: categoryMap[c].value || 0
    })).sort((a, b) => b.units - a.units).slice(0, 5);

    if (sorted.length === 0) {
      sorted = [
        { name: 'Linens', units: 480 },
        { name: 'Amenities', units: 310 },
        { name: 'Food & Bev', units: 290 },
        { name: 'Beverages', units: 245 },
        { name: 'Cleaning', units: 185 }
      ];
    }

    const maxUnits = Math.max(...sorted.map(s => s.units), 100);
    const barColors = ['bg-primary', 'bg-primary-fixed-dim', 'bg-secondary-fixed-dim', 'bg-secondary', 'bg-secondary-container'];
    const yLabels = [Math.round(maxUnits), Math.round(maxUnits * 0.75), Math.round(maxUnits * 0.5), Math.round(maxUnits * 0.25), 0];

    const barsHtml = sorted.map((item, idx) => {
      const heightPct = Math.max(15, Math.round((item.units / maxUnits) * 92));
      const colorClass = barColors[idx % barColors.length];
      const shortName = item.name.split(' ')[0].replace('&', '');
      return `
        <div class="flex flex-col items-center gap-xs z-10 w-full group">
          <span class="font-data-tabular text-data-tabular text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity">${item.units}</span>
          <div class="w-full ${colorClass} rounded-t-sm" style="height: ${heightPct}%; transition: height 0.8s ease-out;"></div>
          <span class="font-label-caps text-label-caps text-outline mt-sm rotate-45 md:rotate-0 origin-left truncate w-full text-center" title="${item.name}">${shortName}</span>
        </div>
      `;
    }).join('');

    container.innerHTML = `
      <div class="absolute inset-0 flex flex-col justify-between pointer-events-none opacity-20 z-0">
        <div class="border-b border-outline-variant w-full"></div>
        <div class="border-b border-outline-variant w-full"></div>
        <div class="border-b border-outline-variant w-full"></div>
        <div class="border-b border-outline-variant w-full"></div>
        <div class="border-b border-outline-variant w-full"></div>
      </div>
      <div class="absolute -left-2 inset-y-0 flex flex-col justify-between items-end text-outline text-data-tabular font-data-tabular py-xs z-10 translate-x-[-100%]">
        ${yLabels.map(y => `<span>${y}</span>`).join('')}
      </div>
      ${barsHtml}
    `;
  },

  renderTopIssuedItems: function() {
    const container = document.getElementById('topIssuedList');
    if (!container) return;

    const issueMap = {};
    this.state.recentTransactions.forEach(t => {
      if (t.type === 'STOCK_OUT') {
        const key = t.itemId || t.sku || t.itemName;
        if (!issueMap[key]) {
          issueMap[key] = {
            name: t.itemName,
            sku: t.sku,
            category: t.category,
            qty: 0,
            value: 0
          };
        }
        issueMap[key].qty += Number(t.quantity) || 0;
        issueMap[key].value += Number(t.totalCost) || (Number(t.quantity) * Number(t.unitPrice)) || 0;
      }
    });

    let list = Object.values(issueMap).sort((a, b) => b.qty - a.qty).slice(0, 3);

    if (list.length === 0) {
      list = this.state.items.slice(0, 3).map((item, idx) => ({
        name: item.name,
        sku: item.sku,
        category: item.category,
        qty: 120 - idx * 35,
        value: (120 - idx * 35) * (Number(item.unitCost) || 100),
        stock: item.totalStock
      }));
    }

    const defaultIcons = [
      '<span class="material-symbols-outlined text-primary text-[22px]">bed</span>',
      '<span class="material-symbols-outlined text-secondary text-[22px]">dry_cleaning</span>',
      '<span class="material-symbols-outlined text-tertiary text-[22px]">soap</span>'
    ];

    container.innerHTML = list.map((item, idx) => {
      const matched = this.state.items.find(i => i.sku === item.sku || i.name === item.name);
      const stock = matched ? matched.totalStock : (item.stock || 50);
      return `
        <div onclick="app.openBarcodeModal('${matched ? matched.id : ''}')" class="flex items-center gap-md py-sm px-xs hover:bg-surface-container-high rounded-lg transition-colors group cursor-pointer relative">
          <div class="absolute left-0 top-0 bottom-0 w-1 bg-primary rounded-r-full opacity-0 group-hover:opacity-100 transition-opacity"></div>
          <div class="w-10 h-10 rounded-md overflow-hidden bg-surface flex-shrink-0 flex items-center justify-center">
            ${defaultIcons[idx % defaultIcons.length]}
          </div>
          <span class="font-body-md text-body-md text-on-surface flex-1 truncate" title="${item.name}">${item.name}</span>
          <span class="font-data-tabular text-data-tabular text-on-surface-variant w-24 truncate">${item.sku}</span>
          <span class="font-data-tabular text-data-tabular text-on-surface w-16 text-right">${item.qty}</span>
          <span class="font-data-tabular text-data-tabular text-on-surface w-20 text-right">${this.formatCurrency(item.value)}</span>
          <span class="font-data-tabular text-data-tabular text-on-surface w-16 text-right font-bold">${stock}</span>
        </div>
      `;
    }).join('');
  },

  renderRecentRequisitions: function() {
    const container = document.getElementById('recentReqsList');
    const tbody = document.getElementById('requisitionsTableBody');

    const reqs = this.state.recentTransactions.filter(t => t.type === 'STOCK_OUT' || t.type === 'TRANSFER');
    const displayReqs = reqs.length > 0 ? reqs.slice(0, 3) : [
      { id: 'REQ-8812', timestamp: new Date().toISOString(), itemName: 'King Size Bed Sheets', destLocation: 'Deneb Hotel (3rd Fl)', quantity: 45, status: 'Shipped' },
      { id: 'REQ-6812', timestamp: new Date(Date.now() - 86400000).toISOString(), itemName: 'Organic Amenities Kits', destLocation: 'Pollux Hotel Store', quantity: 18, status: 'Approved' },
      { id: 'REQ-6809', timestamp: new Date(Date.now() - 86400000 * 2).toISOString(), itemName: 'Bath Towels 700GSM', destLocation: 'Housekeeping', quantity: 24, status: 'Pending' }
    ];

    if (container) {
      container.innerHTML = displayReqs.map(r => {
        const d = r.timestamp ? new Date(r.timestamp).toLocaleDateString('en-US', { day: 'numeric', month: 'short' }) : 'Today';
        const status = r.status || (r.type === 'TRANSFER' ? 'Shipped' : 'Approved');
        const statusPill = status === 'Shipped'
          ? `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-secondary-container/20 text-secondary border border-secondary/20"><span class="w-1.5 h-1.5 rounded-full bg-secondary"></span><span class="font-label-caps text-label-caps">Shipped</span></span>`
          : status === 'Approved'
          ? `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-tertiary-container/20 text-tertiary border border-tertiary/20"><span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span><span class="font-label-caps text-label-caps">Approved</span></span>`
          : `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-outline-variant/30 text-outline border border-outline-variant/50"><span class="w-1.5 h-1.5 rounded-full bg-outline"></span><span class="font-label-caps text-label-caps">Pending</span></span>`;

        return `
          <div class="flex items-center gap-md py-sm px-xs hover:bg-surface-container-high rounded-lg transition-colors">
            <span class="font-data-tabular text-data-tabular text-primary w-24 cursor-pointer hover:underline truncate">${r.reference || '#' + r.id}</span>
            <span class="font-data-tabular text-data-tabular text-on-surface-variant w-16">${d}</span>
            <div class="flex flex-col flex-1 truncate">
              <span class="font-body-sm text-body-sm text-on-surface truncate">${r.destLocation || r.sourceLocation || 'Department'}</span>
            </div>
            <div class="w-20">
              ${statusPill}
            </div>
            <span class="font-data-tabular text-data-tabular text-on-surface w-16 text-right">${r.quantity} Items</span>
          </div>
        `;
      }).join('');
    }

    if (tbody) {
      const fullList = reqs.length > 0 ? reqs : displayReqs;
      tbody.innerHTML = fullList.map(r => {
        const d = r.timestamp ? new Date(r.timestamp).toLocaleDateString('en-US', { day: 'numeric', month: 'short' }) : 'Today';
        return `
          <tr class="hover:bg-surface-container-high transition">
            <td class="py-3 px-4 font-data-tabular text-primary font-bold">${r.reference || r.id}</td>
            <td class="py-3 px-3 font-data-tabular text-on-surface-variant">${d}</td>
            <td class="py-3 px-4 font-bold text-on-surface">${r.itemName || '--'}</td>
            <td class="py-3 px-3 text-center font-bold font-data-tabular text-secondary">${r.quantity}</td>
            <td class="py-3 px-3 text-on-surface-variant">${r.sourceLocation || 'Central Warehouse'}</td>
            <td class="py-3 px-3 font-medium text-on-surface">${r.destLocation || 'Housekeeping'}</td>
            <td class="py-3 px-3 text-on-surface-variant">${r.performedBy || 'Department Staff'}</td>
            <td class="py-3 px-3 text-center">
              <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-secondary-container/20 text-secondary border border-secondary/20">
                <span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
                <span class="font-label-caps text-label-caps">Approved</span>
              </span>
            </td>
          </tr>
        `;
      }).join('');
    }
  },

  renderManagedProperties: function(locations) {
    const container = document.getElementById('managedPropertiesList');
    if (!container) return;

    const locData = locations || (this.state.metrics ? this.state.metrics.stores : null) || {
      central: { units: 1980, valuation: 380000 },
      s001: { units: 680, valuation: 125000 },
      s002: { units: 573, valuation: 100330 }
    };

    const stores = [
      {

  renderCategoryChart: function(categoryMap) {
    const canvas = document.getElementById('categoryChart');
    if (!canvas) return;

    const labels = Object.keys(categoryMap);
    const dataVals = labels.map(l => categoryMap[l].value || 0);

    const colors = [
      '#2563eb', // primary blue
      '#4edea3', // secondary emerald
      '#ffb95f', // tertiary amber
      '#ffb4ab', // error red
      '#b4c5ff', // primary dim
      '#00a572', // dark secondary
      '#8d90a0', // outline slate
      '#e1e2ed'  // on-surface
    ];

    if (this.state.categoryChart) {
      this.state.categoryChart.destroy();
    }

    const ctx = canvas.getContext('2d');
    this.state.categoryChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: dataVals,
          backgroundColor: colors.slice(0, labels.length),
          borderWidth: 2,
          borderColor: '#191b23'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              boxWidth: 10,
              font: { size: 11, family: 'Hanken Grotesk' },
              color: '#c3c6d7'
            }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                const val = context.raw || 0;
                return ` ${context.label}: ${app.formatCurrency(val)}`;
              }
            }
          }
        },
        cutout: '68%'
      }
    });
  },

    const t = String(type).toUpperCase();

  filterCatalogByLowStock: function() {

  filterCatalog: function() {
    const searchVal = (document.getElementById('catalogSearchInput')?.value || '').toLowerCase().trim();
    const catVal = document.getElementById('catalogCategoryFilter')?.value || 'ALL';
    const stockVal = document.getElementById('catalogStockFilter')?.value || 'ALL';
    const propFilter = this.state.propertyFilter;

    let items = this.state.items.filter(item => {
      // Search match
      const matchSearch = !searchVal || 
        (item.name && item.name.toLowerCase().includes(searchVal)) ||
        (item.sku && item.sku.toLowerCase().includes(searchVal)) ||
        (item.category && item.category.toLowerCase().includes(searchVal)) ||
        (item.supplier && item.supplier.toLowerCase().includes(searchVal));

      if (!matchSearch) return false;

      // Category match
      if (catVal !== 'ALL' && item.category !== catVal) return false;

      // Stock status filter
      const total = Number(item.totalStock) || 0;
      const min = Number(item.minStock) || 0;
      if (stockVal === 'LOW' && (total > min || total === 0)) return false;
      if (stockVal === 'OUT' && total !== 0) return false;
      if (stockVal === 'OK' && total <= min) return false;

      // Property specific non-zero check if selected
      if (propFilter === 'CENTRAL' && stockVal !== 'ALL' && item.centralStock <= 0) return false;
      if (propFilter === 'DENEB' && stockVal !== 'ALL' && item.denebStock <= 0) return false;
      if (propFilter === 'POLLUX' && stockVal !== 'ALL' && item.polluxStock <= 0) return false;

      return true;
    });

    this.renderCatalogTable(items);
  },

          </td>

              <span class="bg-surface-container-highest text-on-surface-variant px-1.5 py-0.5 rounded text-[10px] font-medium">${item.category}</span>
              ${item.supplier ? `<span class="truncate max-w-[140px] text-outline text-[11px] flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">local_shipping</span>${item.supplier}</span>` : ''}
            </div>
          </td>

          <!-- Property Stocks -->
          <td class="py-3 px-3 text-center font-data-tabular font-bold text-primary">${item.centralStock}</td>
          <td class="py-3 px-3 text-center font-data-tabular font-bold text-secondary">${item.denebStock}</td>
          <td class="py-3 px-3 text-center font-data-tabular font-bold text-tertiary">${item.polluxStock}</td>

          <!-- Total Stock -->
          <td class="py-3 px-3 text-center font-data-tabular font-extrabold text-sm ${isOut ? 'text-error' : isLow ? 'text-tertiary' : 'text-on-surface'}">
            ${item.totalStock} <span class="text-[10px] font-normal text-outline">${item.unit}</span>
          </td>

          </td>

          <!-- Unit Cost -->
          <td class="py-3 px-3 text-right text-on-surface-variant font-data-tabular">

          </td>

  filterTransactions: function() {
    const searchVal = (document.getElementById('txnSearchInput')?.value || '').toLowerCase().trim();
    const typeVal = document.getElementById('txnTypeFilter')?.value || 'ALL';

    const filtered = this.state.recentTransactions.filter(t => {
      if (typeVal !== 'ALL' && t.type !== typeVal) return false;
      if (!searchVal) return true;

      return (
        (t.id && t.id.toLowerCase().includes(searchVal)) ||
        (t.itemName && t.itemName.toLowerCase().includes(searchVal)) ||
        (t.sku && t.sku.toLowerCase().includes(searchVal)) ||
        (t.reference && t.reference.toLowerCase().includes(searchVal)) ||
        (t.performedBy && t.performedBy.toLowerCase().includes(searchVal)) ||
        (t.notes && t.notes.toLowerCase().includes(searchVal))
      );
    });

    this.renderTransactionsTable(filtered);
  },

  renderTransactionsTable: function(txns) {
    const tbody = document.getElementById('transactionsTableBody');

    if (!txns || txns.length === 0) {

      const typeBadge = this.getTypeBadge(t.type);
      const dateFormatted = t.timestamp ? new Date(t.timestamp).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '--';

      return `
        <tr class="hover:bg-surface-container-high transition border-b border-outline-variant/10 text-on-surface">
          <td class="py-3 px-4 font-mono text-[11px] text-outline">${t.id}</td>

          <td class="py-3 px-3 font-mono text-xs text-primary">${t.reference || '--'}</td>

  saveAppSettings: function() {
    const name = document.getElementById('settingHotelName').value.trim();
    const curr = document.getElementById('settingCurrencySymbol').value.trim();

    this.showLoading('Saving settings...', 'Updating system preferences');
    const newSettings = {
      HOTEL_NAME: name,
      CURRENCY_SYMBOL: curr
    };

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function() {
          app.hideLoading();
          app.state.settings.HOTEL_NAME = name;
          app.state.settings.CURRENCY_SYMBOL = curr;
          app.renderDashboard();
          app.filterCatalog();
          app.showToast('Settings saved successfully!');
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Error saving settings: ' + err.message, 'error');
        })
        .saveSettings(newSettings);
    } else {
      this.hideLoading();
      this.state.settings.HOTEL_NAME = name;
      this.state.settings.CURRENCY_SYMBOL = curr;
      this.renderDashboard();
      this.showToast('Settings updated (local test mode)');
    }

  // LIVE CAMERA BARCODE SCANNER
  openScannerModal: function() {
    this.openModal('scannerModal');
    const viewport = document.getElementById('scannerViewport');

    if (typeof Html5Qrcode !== 'undefined') {
      try {
        if (!this.state.html5QrScanner) {
          this.state.html5QrScanner = new Html5Qrcode('scannerViewport');
        }

        const config = { fps: 10, qrbox: { width: 250, height: 160 } };
        this.state.html5QrScanner.start(
          { facingMode: 'environment' },
          config,
          (decodedText) => {
            app.handleScanSuccess(decodedText);
          },
          (error) => {
            // Scanning in progress
          }
        ).catch(err => {
          console.warn('Camera scan not started or permission denied', err);
          viewport.innerHTML = `<div class="p-4 text-center text-slate-300">Camera not accessible or permission denied. Please enter SKU manually below.</div>`;
        });
      } catch (err) {
        console.error('Scanner init error', err);
      }
    }
  },

  closeScannerModal: function() {
    if (this.state.html5QrScanner && this.state.html5QrScanner.isScanning) {
      this.state.html5QrScanner.stop().then(() => {
        app.closeModal('scannerModal');
      }).catch(() => {
        app.closeModal('scannerModal');
      });
    } else {
      this.closeModal('scannerModal');
    }
  },

  handleScanSuccess: function(decodedText) {
    this.closeScannerModal();
    this.processScannedCode(decodedText);
  },

  handleManualScanSubmit: function() {
    const input = document.getElementById('manualBarcodeInput');
    const val = (input ? input.value : '').trim();
    if (!val) return;
    this.closeScannerModal();
    this.processScannedCode(val);
  },

  processScannedCode: function(code) {
    const clean = code.trim().toUpperCase();
    const item = this.state.items.find(i => 
      (i.sku && i.sku.toUpperCase() === clean) || 
      (i.id && i.id.toUpperCase() === clean)
    );

    if (item) {
      this.showToast(`Found Item: ${item.name} (${item.sku})`);
      this.switchTab('inventory');
      const search = document.getElementById('catalogSearchInput');
      if (search) {
        search.value = item.sku;
        this.filterCatalog();
      }
    } else {
      if (confirm(`Scanned SKU "${code}" was not found in catalog. Would you like to create a new item with this SKU?`)) {
        this.openItemModal();
        document.getElementById('itemSku').value = clean;
      }
    }
  },

  // SUPPLIERS MODAL
  openSupplierModal: function(sup = null) {
    const form = document.getElementById('supplierForm');
    form.reset();

    if (sup) {
      document.getElementById('supplierId').value = sup.id;
      document.getElementById('supplierName').value = sup.name;
      document.getElementById('supplierContact').value = sup.contactPerson;
      document.getElementById('supplierPhone').value = sup.phone;
      document.getElementById('supplierEmail').value = sup.email;
      document.getElementById('supplierCategories').value = sup.categorySupplied;
      document.getElementById('supplierAddress').value = sup.address;
    } else {
      document.getElementById('supplierId').value = '';
    }

    this.openModal('supplierModal');
  },

  editSupplier: function(supId) {
    const s = this.state.suppliers.find(x => x.id === supId);
    if (s) this.openSupplierModal(s);
  },

  handleSupplierFormSubmit: function(e) {
    e.preventDefault();
    const data = {
      id: document.getElementById('supplierId').value,
      name: document.getElementById('supplierName').value.trim(),
      contactPerson: document.getElementById('supplierContact').value.trim(),
      phone: document.getElementById('supplierPhone').value.trim(),
      email: document.getElementById('supplierEmail').value.trim(),
      categorySupplied: document.getElementById('supplierCategories').value.trim(),
      address: document.getElementById('supplierAddress').value.trim(),
      status: 'Active'
    };

    this.showLoading('Saving Supplier...', 'Updating vendor directory in Sheets');

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function() {
          app.hideLoading();
          app.closeModal('supplierModal');
          app.showToast('Supplier saved: ' + data.name);
          app.loadInitialData(true);
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Supplier save error: ' + err.message, 'error');
        })
        .saveSupplier(data);
    } else {
      this.hideLoading();
      this.closeModal('supplierModal');
      this.showToast('Supplier saved (local mode)');
    }
  },

  confirmDeleteSupplier: function(supId) {
    if (!confirm('Are you sure you want to remove this supplier?')) return;
    this.showLoading('Deleting Supplier...', 'Updating vendor sheet');

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function() {
          app.hideLoading();
          app.showToast('Supplier removed');
          app.loadInitialData(true);
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Delete error: ' + err.message, 'error');
        })
        .deleteSupplier(supId);
    } else {
      this.hideLoading();
      this.showToast('Supplier removed (local mode)');
    }
  },

  // CSV EXPORTERS
  exportCatalogCSV: function() {
    if (!this.state.items || this.state.items.length === 0) {
      this.showToast('No items to export.', 'error');
      return;
    }

    const headers = ['Item ID', 'SKU', 'Item Name', 'Category', 'Unit', 'Central Stock', 'Deneb Stock', 'Pollux Stock', 'Total Stock', 'Min Stock', 'Unit Cost', 'Total Valuation', 'Supplier'];
    const rows = this.state.items.map(i => [
      `"${i.id}"`,
      `"${i.sku}"`,
      `"${(i.name || '').replace(/"/g, '""')}"`,
      `"${i.category}"`,
      `"${i.unit}"`,
      i.centralStock,
      i.denebStock,
      i.polluxStock,
      i.totalStock,
      i.minStock,
      i.unitCost,
      i.totalValue,
      `"${(i.supplier || '').replace(/"/g, '""')}"`
    ]);

    const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement('a');
    link.setAttribute('href', encodedUri);
    link.setAttribute('download', `DNP_HOTELS_Inventory_${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    this.showToast('Inventory catalog exported to CSV!');
  },

  exportTransactionsCSV: function() {
    if (!this.state.recentTransactions || this.state.recentTransactions.length === 0) {
      this.showToast('No transaction records to export.', 'error');
      return;
    }

    const headers = ['Transaction ID', 'Date Time', 'Type', 'SKU', 'Item Name', 'Quantity', 'Unit', 'Source', 'Destination', 'Total Cost', 'Reference', 'Staff', 'Notes'];
    const rows = this.state.recentTransactions.map(t => [
      `"${t.id}"`,
      `"${t.timestamp}"`,
      `"${t.type}"`,
      `"${t.sku}"`,
      `"${(t.itemName || '').replace(/"/g, '""')}"`,
      t.quantity,
      `"${t.unit || ''}"`,
      `"${t.sourceLocation || ''}"`,
      `"${t.destLocation || ''}"`,
      t.totalCost,
      `"${(t.reference || '').replace(/"/g, '""')}"`,
      `"${(t.performedBy || '').replace(/"/g, '""')}"`,
      `"${(t.notes || '').replace(/"/g, '""')}"`
    ]);

    const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement('a');
    link.setAttribute('href', encodedUri);
    link.setAttribute('download', `DNP_HOTELS_Transactions_${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    this.showToast('Transactions audit log exported to CSV!');
  },
